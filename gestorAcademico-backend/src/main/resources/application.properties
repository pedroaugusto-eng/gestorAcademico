spring.application.name=gestorAcademico

# Banco em memória (H2): os dados somem quando a aplicação para.
spring.datasource.url=jdbc:h2:mem:gestor;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true
# Sem isto, no Java 17 do Windows o data.sql é lido em Cp1252 e os acentos quebram.
spring.sql.init.encoding=UTF-8
# As consultas ficam dentro dos services (transação), não na renderização da resposta.
spring.jpa.open-in-view=false

# Cookie de sessão: inacessível ao JavaScript e enviado só pelo próprio site.
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.timeout=30m
# Em produção com HTTPS, ligar também:
# server.servlet.session.cookie.secure=true

# Nunca mandar detalhes internos de erro para o navegador.
server.error.include-message=never
server.error.include-stacktrace=never
